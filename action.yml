# Runs migration-lint from this action's own checkout, so the project needs no Node tooling of its own.
# `--history` compares the branch with its base: the caller's actions/checkout needs `fetch-depth: 0`.
name: migrations-safe
description: Lint database migrations and check the git history of applied ones (PostgreSQL, SQLite, MySQL, MariaDB, SQL Server, Oracle, Db2).
branding:
  icon: database
  color: blue
inputs:
  args:
    description: Arguments for migration-lint (run `migration-lint --help` for the list).
    default: --history --base origin/${{ github.base_ref }} --format github
  node-version:
    description: Node.js version to run it with (22.13 or newer).
    default: '24'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      env:
        MSAFE_ARGS: ${{ inputs.args }}
      run: node "${{ github.action_path }}/skills/migrations-safe/scripts/migration-lint.mjs" $MSAFE_ARGS
